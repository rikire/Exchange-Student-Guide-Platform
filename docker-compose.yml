# Demo and handover stand. The deliverable for the stakeholder is this file plus the instructions
# in docs/handoff/, so it has to work on a clean machine with nothing but Docker installed.
#
#   cp .env.example .env    # then set POSTGRES_PASSWORD, and GUIDE_ADMIN_PASSWORD_HASH to moderate
#   docker compose up --build
#
# The application starts with the `seed` profile, which loads the starter articles on every start
# and skips the ones already there, so a restart adds nothing.
#
# The search index is kept in the guide-index volume and built again from the database at every
# start (ADR-0004, amended 5 Oct), so a database restore or a change to how articles are indexed
# needs only a restart (FEAT-007).
#
# Uploaded media (FEAT-009) is kept in the guide-media volume, so an attachment survives a restart
# and a rebuild of the image.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guide}
      POSTGRES_USER: ${POSTGRES_USER:-guide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - guide-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: seed
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-guide}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-guide}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Empty keeps the moderator login closed rather than failing the start: the stand serves
      # readers without it.
      GUIDE_ADMIN_PASSWORD_HASH: ${GUIDE_ADMIN_PASSWORD_HASH:-}
      # NFR-005's submissions per client address per hour (guide.contribute.submission-limit),
      # raised in .env for a manual walk where one tester sends many; 5 otherwise.
      GUIDE_CONTRIBUTE_SUBMISSIONLIMIT_REQUESTS: ${GUIDE_CONTRIBUTE_SUBMISSIONLIMIT_REQUESTS:-5}
      # Behind an HTTPS reverse proxy (DEBT-014, docs/handoff/install.md): trust X-Forwarded-For and
      # X-Forwarded-Proto from the proxy's address only, and send the session cookie over https alone.
      # Off by default: on plain http a Secure cookie never comes back and nobody stays signed in.
      SERVER_FORWARD_HEADERS_STRATEGY: ${GUIDE_FORWARD_HEADERS:-none}
      SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: ${GUIDE_TRUSTED_PROXY:-}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${GUIDE_COOKIE_SECURE:-false}
      # The zone pages show times in (guide.time-zone); India's unless .env sets another.
      GUIDE_TIMEZONE: ${GUIDE_TIMEZONE:-Asia/Kolkata}
      # NFR-001's upload limits (guide.media.*), the defaults of application.yml repeated because
      # Compose passes a variable only when it has a value; set in .env to change one.
      GUIDE_MEDIA_PHOTOLIMIT: ${GUIDE_MEDIA_PHOTOLIMIT:-10MB}
      GUIDE_MEDIA_DOCUMENTLIMIT: ${GUIDE_MEDIA_DOCUMENTLIMIT:-20MB}
      GUIDE_MEDIA_VIDEOLIMIT: ${GUIDE_MEDIA_VIDEOLIMIT:-500MB}
      GUIDE_MEDIA_VOLUMELIMIT: ${GUIDE_MEDIA_VOLUMELIMIT:-100GB}
      # How long a rejected submission's files are kept (guide.media.rejected-kept-for).
      GUIDE_MEDIA_REJECTEDKEPTFOR: ${GUIDE_MEDIA_REJECTEDKEPTFOR:-7d}
      GUIDE_INDEX_TYPE: local-filesystem
      GUIDE_INDEX_DIR: /var/lib/guide/index
      GUIDE_MEDIA_ROOT: /var/lib/guide/media
      # TODO(DEBT-014): SERVER_SERVLET_SESSION_COOKIE_SECURE: "true" once the stand is behind TLS.
    volumes:
      - guide-index:/var/lib/guide/index
      - guide-media:/var/lib/guide/media
    ports:
      - "8080:8080"

volumes:
  guide-media:
  guide-index:
  guide-db:
