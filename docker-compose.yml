# Demo and handover stand. The deliverable for the stakeholder is this file plus the instructions
# in docs/handoff/, so it has to work on a clean machine with nothing but Docker installed.
#
#   cp .env.example .env    # then set POSTGRES_PASSWORD, and GUIDE_ADMIN_PASSWORD_HASH to moderate
#   docker compose up --build
#
# The application starts with the `seed` profile, which loads the starter articles on every start
# and skips the ones already there, so a restart adds nothing.
#
# Not finished (phase 4, docs/roadmap/04-hardening.md): guide-media and guide-index are declared
# but mounted nowhere, because no code writes media or a search index yet.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guide}
      POSTGRES_USER: ${POSTGRES_USER:-guide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - guide-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: seed
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-guide}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-guide}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Empty keeps the moderator login closed rather than failing the start: the stand serves
      # readers without it.
      GUIDE_ADMIN_PASSWORD_HASH: ${GUIDE_ADMIN_PASSWORD_HASH:-}
    ports:
      - "8080:8080"

volumes:
  guide-media:
  guide-index:
  guide-db:
