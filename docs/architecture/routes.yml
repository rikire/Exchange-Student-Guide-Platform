# The route contract: one entry per route, the source of the tables in ui-routes.md.
# `ai-tools routes` writes those tables; RouteContractTest compares the `built` routes with the
# controllers in both directions. Text fields are Markdown, folded here and joined back to one
# line by YAML. Decided by the human on 27 Sep (docs/roadmap/03-main-flow.md, queue item 11).

routes:
  - methods: [GET]
    path: /articles
    slice: articleview
    status: built
    template: >-
      `articleview/ArticleList.html`
    fields: >-
      `sort` (optional: `title`, the default, `updated` or `views`); `tag` (optional, a tag's address
      as on `/tags/{tag}`); `page` (optional, from 1)
    responses: >-
      `200` with up to 50 published articles in that order, and with a tag no published article
      carries a note and a link to the full list; `400` for any other `sort` or a `page` below 1;
      `404` for a page past the last; the landing page links here
    serves: >-
      FR-033: every article, not only the landing page's newest twelve (walkthrough F-7); `views`
      orders by FR-034's count

  - methods: [GET]
    path: /articles/{title}
    slice: articleview
    status: built
    template: >-
      `articleview/Article.html`
    fields: >-
      — (read only)
    responses: >-
      `200` published; `404` unapproved / rejected / removed / no match
    serves: >-
      FR-001 (UC-003), with the article's attached media below the text, each fetched from
      `GET /media/{id}` ([FEAT-009](../features/FEAT-009-attaching-media-to-a-submission.md)). Also
      where FR-002 and FR-004 are visible — the body is rendered with wiki links resolved and red
      links styled inline; neither has a route of its own. And FR-030: the page carries the "Save as
      PDF" control, which `/js/print.js` turns into the browser's print, and print styles leave the
      site out; `ArticleController` serves it, so the anchor is there. A signed-in moderator also
      sees "Remove this article", leading to FR-026's confirmation. FR-006: below the text, "What
      links here" lists up to 50 live articles linking to this one, from `backlink` (ADR-0016). FR-034:
      a `200` to anyone but the signed-in moderator adds one view, so this `GET` writes (ADR-0021). FR-032: every photo on the page, in the text or attached, opens full screen in PhotoSwipe (ADR-0018)

  - methods: [GET]
    path: /
    slice: home
    status: built
    template: >-
      `home/Landing.html`
    fields: >-
      —
    responses: >-
      `200` always
    serves: >-
      FR-009 (UC-007); FR-031: the tags are listed most visited first, by name among equals, each
      with the number of live articles carrying it

  - methods: [GET]
    path: /search
    query: "q={query}"
    slice: search
    status: built
    template: >-
      `search/SearchResults.html`
    fields: >-
      `q` (text, required)
    responses: >-
      `200` always, including zero matches; `400` if `q` is missing or blank — an empty query is the
      landing page's job, and redirecting there silently would hide a broken link from whoever built
      it; `400` if `q` has more than 50 words as the index's analyzer splits them, which past Lucene's
      clause limit answered `500` (decided 28 Sep). An article matches when it holds every word of
      the query; each result shows its title and a passage of its text with the words marked
      (walkthrough fix 1.5, 2 Oct)
    serves: >-
      FR-007 (UC-001)

  - methods: [GET]
    path: /tags
    slice: taxonomy
    status: built
    template: >-
      `taxonomy/TagIndex.html`
    fields: >-
      —
    responses: >-
      `200` always: every tag a live article carries, by name, each with its article count and a
      link to `/tags/{tag}`; at most 500, and the page says when there are more (ADR-0010); "No tags
      yet" when none. Linked from every page's header (walkthrough fix 2.1, decided 1 Oct)
    serves: >-
      FR-008 (UC-002): a way to browse the tags without the landing page

  - methods: [GET]
    path: /tags/{tag}
    slice: taxonomy
    status: built
    template: >-
      `taxonomy/TagBrowse.html`
    fields: >-
      —
    responses: >-
      `200` when a published article carries a tag with this address; `404` otherwise, including a
      tag only a pending or rejected submission or a removed article carries. The address is the tag's name by the article
      address rule (`wikilink`'s `ArticleAddress`), so `visa/frro` and `visa frro` share `/tags/visa-frro`
      and a tag of only symbols has none (decided 28 Sep, FEAT-008)
    serves: >-
      FR-008 (UC-002); FR-031: a `200` adds one visit to every tag behind the address, so this
      `GET` writes (ADR-0017), and a `404` writes nothing

  - methods: [GET]
    path: /media/{id}
    slice: media
    status: built
    template: >-
      — (bytes, not a template)
    fields: >-
      —
    responses: >-
      `200` for an asset on a published article; `200` for an asset on a pending or rejected
      submission **only** with a moderator session; `404` otherwise. `nosniff` always, `Range`
      supported for video; `Content-Disposition: attachment` for everything but a photo — see
      [security.md](security.md)
    serves: >-
      FR-001 (an Article is "…and zero or more attached media assets"), FR-015 ("full text **and any
      media assets**"), FR-016 (every asset on an article page has a Download link to this route
      with the `download` attribute, so a photo or a video is saved under its original name too)

  - methods: [GET]
    path: /submit
    slice: contribute
    status: built
    template: >-
      `contribute/SubmissionForm.html`
    fields: >-
      — (empty form; fields below belong to the POST)
    responses: >-
      `200` always
    serves: >-
      FR-010 (UC-010) — entry point

  - methods: [POST]
    path: /submissions
    slice: contribute
    status: built
    template: >-
      re-renders `contribute/SubmissionForm.html` on `422`
    fields: >-
      CSRF token (hidden, required); `title` (text, required, unique among published titles
      case-insensitively); `summary` (text, required); `body` (markdown textarea, required — may
      contain `[[Title]]`, stored unchanged per FR-003); `attachment` (file, optional — one photo
      (JPEG, PNG, WebP), document (PDF) or video (MP4, MOV, M4V, 3GP, WebM, MKV, AVI, MPEG), the type
      read from the content;
      NFR-001's size limits; [FEAT-009](../features/FEAT-009-attaching-media-to-a-submission.md));
      `tags` (repeatable text, optional; the form shows at least five fields and ignores the empty
      ones). Sent as `multipart/form-data`
    responses: >-
      `302` to the confirmation route on success; `422` on a title collision (with the offered
      link/rename choice), a rejected attachment, or a field over its limit (title 255, summary 300,
      body 100,000 characters, at most 10 tags, decided 1 Oct); `413` with the empty form and the error when the
      request is larger than the container accepts, before any field is read; `429` re-rendering the
      form with the text typed and `Retry-After` past NFR-005's limit, 5 accepted submissions an hour
      per client address, new articles and edits together
      ([ADR-0019](adr/ADR-0019-rate-limits-per-client-address.md))
    serves: >-
      FR-010 (UC-010), FR-003 (UC-012), NFR-005

  - methods: [GET]
    path: /articles/{title}/edit
    slice: contribute
    status: built
    template: >-
      `contribute/SubmissionForm.html`, pre-filled from the article
    fields: >-
      — (pre-filled form; fields below belong to the POST)
    responses: >-
      `200` published; `404` not published (same rule as the read route)
    serves: >-
      FR-011 (UC-011) — entry point

  - methods: [POST]
    path: /articles/{title}/edits
    slice: contribute
    status: built
    template: >-
      re-renders `contribute/SubmissionForm.html` on `422`
    fields: >-
      Same fields as `POST /submissions`, CSRF token included; FR-011 allows any subset to change.
      The target article comes from `{title}`; `article` (hidden) names the article the form was
      opened for, only to tell a removal since apart (DEBT-009, closed)
    responses: >-
      `302` to the confirmation route on success; `404` if `{title}` matches no published article —
      FR-011's "no longer published" is unconditional, so a POST aimed straight at an unknown or
      never-published title is refused the same way the GET is; `422` on a title collision with a
      *different* article, a rejected attachment, or a field over its limit as for `POST /submissions`; `413` as for `POST /submissions`; `409` re-rendering
      the form with the text typed when the article the form was opened for was removed (FR-026); `429` as for `POST /submissions`, the same count
      before this POST
    serves: >-
      FR-011 (UC-011), FR-003 (UC-012)

  - methods: [POST]
    path: /contribute/preview
    slice: contribute
    status: built
    template: >-
      — (an HTML fragment for the editor's preview pane, not a page)
    fields: >-
      CSRF token (the form's hidden field, sent by the editor's script); `body` (text, the Markdown
      being written)
    responses: >-
      `200` with the body rendered as the article page renders it — wiki links resolved against
      published articles, raw HTML escaped; `413` when `body` is longer than 100,000 characters
      (decided 28 Sep); `403` without the token; `429` with a short fragment for the pane and
      `Retry-After` past NFR-005's limit per client address, 120 a minute by default
      ([ADR-0019](adr/ADR-0019-rate-limits-per-client-address.md))
    serves: >-
      FR-027's preview ([ADR-0013](adr/ADR-0013-markdown-editor-and-front-end-assets.md))

  - methods: [GET]
    path: /submissions/{number}/confirmation
    slice: contribute
    status: built
    template: >-
      `contribute/SubmissionConfirmation.html`
    fields: >-
      —
    responses: >-
      `200` if `{number}` exists; `404` otherwise
    serves: >-
      FR-010 / FR-011's "shown a submission number"

  - methods: [GET]
    path: /submissions/status
    query: "number={number}"
    slice: contribute
    status: built
    template: >-
      `contribute/SubmissionStatus.html`
    fields: >-
      `number` (text; any case, with or without the hyphens and the `SUB` prefix, as ADR-0011 reads a
      typed number)
    responses: >-
      `200` with the form alone when `number` is missing or blank; `200` with the status (pending,
      approved with a link to the article while it is live at its address, rejected with the
      moderator's reason if one was given) — never the submission's text; `404` with the form and
      "No such submission was found" for a number never issued or text that cannot be one. No gate:
      the 60-bit number is the authorisation ([ADR-0011](adr/ADR-0011-submission-number-format.md))
    serves: >-
      FR-012 (UC-013)

  - methods: [GET]
    path: /moderate/queue
    slice: moderate
    status: built
    template: >-
      `moderate/ModerationQueue.html`
    fields: >-
      —
    responses: >-
      `200` always, including the empty-queue state; `302` to `/moderate/login` unauthenticated.
      After an approval, a rejection or a removal it says once what was done, with the title and,
      for an approval, a link to the article; each entry marks its files as photo, PDF or video
      (fix 2.3)
    serves: >-
      FR-014 (UC-014)

  - methods: [GET]
    path: /moderate/submissions/{number}
    slice: moderate
    status: built
    template: >-
      `moderate/SubmissionReview.html` (also hosts the two POST forms below)
    fields: >-
      — (the editable fields below are part of this page but submit to the two POST routes)
    responses: >-
      `200` pending, or `200` showing "no longer pending" if already decided (FR-015 shows the
      state, it does not hide the submission); `404` if `{number}` was never issued; `302`
      unauthenticated. For an edit, the page first shows what it changes against the live article
      (FR-029, [ADR-0015](adr/ADR-0015-showing-an-edit-as-a-diff.md)), the full text one click away
    serves: >-
      FR-015 (UC-015); FR-029

  - methods: [POST]
    path: /moderate/submissions/{number}/approve
    slice: moderate
    status: built
    template: >-
      `moderate/SubmissionReview.html` on error
    fields: >-
      CSRF token (hidden, required); `summary` (text, editable, pre-filled from the submission);
      `tags` (repeatable text, editable, pre-filled from the submission's suggested tags)
    responses: >-
      `302` to `/moderate/queue` on success; `409` if already decided, or if the title's address
      was taken by another article while the submission waited (it stays pending, decided 28 Sep,
      FEAT-006); `422` re-rendering the review for a blank summary, a summary over 300 characters, a tag too long
      to store or more than 10 tags;
      `302` unauthenticated
    serves: >-
      FR-017 (UC-016); FR-020's revision is written by the same POST when the submission is an edit

  - methods: [POST]
    path: /moderate/submissions/{number}/reject
    slice: moderate
    status: built
    template: >-
      `moderate/SubmissionReview.html` on error
    fields: >-
      CSRF token (hidden, required); `reason` (text, optional, at most 2000 characters after the
      surrounding whitespace is trimmed; blank is stored as no reason — FR-019)
    responses: >-
      `302` to `/moderate/queue` on success; `409` if already decided; `422` re-rendering the
      review with the reason typed and the error when the reason is over 2000 characters (the
      submission stays pending); `302` unauthenticated
    serves: >-
      FR-018 (UC-017); FR-019 stores the reason

  - methods: [GET]
    path: /moderate/articles
    slice: moderate
    status: built
    template: >-
      `moderate/ArticleAdmin.html`
    fields: >-
      `page` (optional, from 1)
    responses: >-
      `200` with the pinned articles in their order, each with Move up, Move down and Unpin, and the
      published articles by title, 50 to a page, each with Pin and a link to Remove; `404` for a
      `page` below 1; `302` unauthenticated
    serves: >-
      FR-025 (UC-022), after the HomeAdmin design screen; reached from the moderator's header (fix
      2.3), with no link elsewhere (the human, 1 Oct)

  - methods: [POST]
    path: /moderate/articles/{title}/pin
    slice: moderate
    status: built
    template: >-
      — (redirects)
    fields: >-
      CSRF token (hidden, required)
    responses: >-
      `302` to `/moderate/articles`; `404` if `{title}` matches no published article; `403` without
      the token; `302` unauthenticated
    serves: >-
      FR-025: pins the article last; one already pinned keeps its place (ADR-0021)

  - methods: [POST]
    path: /moderate/articles/{title}/unpin
    slice: moderate
    status: built
    template: >-
      — (redirects)
    fields: >-
      CSRF token (hidden, required)
    responses: >-
      `302` to `/moderate/articles`; `404` if `{title}` matches no published article; `403` without
      the token; `302` unauthenticated
    serves: >-
      FR-025: takes the article out of the pinned section (ADR-0021)

  - methods: [POST]
    path: /moderate/articles/{title}/up
    slice: moderate
    status: built
    template: >-
      — (redirects)
    fields: >-
      CSRF token (hidden, required)
    responses: >-
      `302` to `/moderate/articles`; `404` if `{title}` matches no published article; `403` without
      the token; `302` unauthenticated
    serves: >-
      FR-025: swaps the article's place with the one before it; the first stays first (ADR-0021)

  - methods: [POST]
    path: /moderate/articles/{title}/down
    slice: moderate
    status: built
    template: >-
      — (redirects)
    fields: >-
      CSRF token (hidden, required)
    responses: >-
      `302` to `/moderate/articles`; `404` if `{title}` matches no published article; `403` without
      the token; `302` unauthenticated
    serves: >-
      FR-025: swaps the article's place with the one after it; the last stays last (ADR-0021)

  - methods: [GET]
    path: /moderate/articles/{title}/remove
    slice: moderate
    status: built
    template: >-
      `moderate/RemoveArticle.html`
    fields: >-
      — (the confirmation; Remove submits to the POST below, Cancel goes back to the article)
    responses: >-
      `200` for a published article; `404` if `{title}` matches no published article, removed ones
      included; `302` unauthenticated
    serves: >-
      FR-026 — asks first, because removal cannot be undone from the application

  - methods: [POST]
    path: /moderate/articles/{title}/remove
    slice: moderate
    status: built
    template: >-
      — (redirects)
    fields: >-
      CSRF token (hidden, required)
    responses: >-
      `302` to `/moderate/queue` once `removed_at` is set; `404` as the GET; `302` unauthenticated
    serves: >-
      FR-026

  - methods: [GET, POST]
    path: /moderate/login
    slice: shared/security
    status: built
    template: >-
      `shared/security/AdminLogin.html`
    fields: >-
      CSRF token (hidden, required); `password` (text, required)
    responses: >-
      `200` form; `302` to `/moderate/queue` on success; `401` re-rendering the form on a wrong
      password; `429` re-rendering the form with `Retry-After` once an address has failed 10 times
      in 15 minutes, even with the right password (NFR-005, ADR-0019). `?logout` adds "You are logged
      out". **Not gated** — the one carve-out in the rule above
    serves: >-
      Not itself an `FR` — the session gate [ADR-0009](adr/ADR-0009-admin-authentication.md)
      decided, without which every `/moderate/**` row above is unreachable

  - methods: [POST]
    path: /moderate/logout
    slice: shared/security
    status: built
    template: >-
      — (Spring Security's logout filter; the "Log out" button is `shared/security/LogOut.html` on
      the queue and the review pages)
    fields: >-
      CSRF token (hidden, required)
    responses: >-
      `302` to `/moderate/login?logout`, the session invalidated and the CSRF token cleared; `403`
      without the token, the session left as it was. Not gated: without a session it only redirects
    serves: >-
      Ending ADR-0009's session on a shared office computer (DEBT-019, closed)

# Features whose routes are not designed yet: kept here so the whole contract is in one place.
deferred:
  - feature: >-
      Backlinks on an article
    priority: could
    requirements: >-
      FR-006
  - feature: >-
      Creating an article from a red link
    priority: could
    requirements: >-
      FR-005
  - feature: >-
      Report an article
    priority: could
    requirements: >-
      FR-021
  - feature: >-
      Abuse handling (rate limiting + CAPTCHA)
    priority: should
    requirements: >-
      FR-013
  - feature: >-
      Version-history groundwork
    priority: should
    requirements: >-
      FR-020 — no UI route; storage only
  - feature: >-
      Closing a report
    priority: could
    requirements: >-
      FR-022
  - feature: >-
      Write/publish directly, bypassing the queue (×2)
    priority: could
    requirements: >-
      FR-023, FR-024
