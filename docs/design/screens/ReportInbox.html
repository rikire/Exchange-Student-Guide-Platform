<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report inbox — Exchange Student Guide (draft screen)</title>
<!-- Rough Stage-3 sketch, generated from canvas-src/flow/ReportInbox.dc.html — not the deliverable,
     a thinking tool. See docs/design/README.md for how this fits the design process. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root { --maroon:#781F19; --maroon-dark:#5C1712; --ink:#1F1917; --ink-soft:#5B534C; --paper:#FFFFFF; --sand:#F7F4EF; --line:#E6DFD3; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .page { font-family: 'Public Sans', system-ui, sans-serif; color: var(--ink); background: var(--sand); min-height: 100%; display: flex; flex-direction: column; }
    .header-bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 40px; background: var(--paper); border-bottom: 1px solid var(--line); }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-logo { height: 30px; width: auto; }
    .admin-badge { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--maroon); border: 1px solid var(--maroon); border-radius: 4px; padding: 2px 8px; }
    .header-nav { display: flex; gap: 20px; }
    .header-nav a { font-size: 14px; font-weight: 600; color: var(--ink-soft); text-decoration: none; }
    .body { padding: 40px; max-width: 700px; }
    .title { font-size: 24px; font-weight: 700; margin: 0 0 20px 0; }
    .report-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 16px 20px; margin-bottom: 12px; }
    .report-title { font-size: 15px; font-weight: 700; margin: 0; }
    .report-title a { color: var(--ink); text-decoration: none; }
    .report-meta { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
    .btn-row { display: flex; gap: 8px; flex-shrink: 0; }
    .btn { height: 34px; padding: 0 14px; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-edit { background: transparent; border: 1.5px solid var(--maroon); color: var(--maroon); }
    .btn-close { background: var(--sand); border: 1.5px solid var(--line); color: var(--ink-soft); }
  </style>
</head>
<body>
<div class="page">
  <div class="header-bar">
    <div class="header-left"><img src="../assets/oge-logo.svg" alt="OGE logo" class="header-logo"><span class="admin-badge">Moderator</span></div>
    <div class="header-nav"><a href="#">Queue</a><a href="#">Reports</a></div>
  </div>
  <div class="body">
    <h1 class="title">Reported articles</h1>
    <div class="report-card">
      <div>
        <h3 class="report-title"><a href="#">Chennai monsoon survival guide</a></h3>
        <div class="report-meta">Reported 2 days ago</div>
      </div>
      <div class="btn-row"><button class="btn btn-edit">Edit article</button><button class="btn btn-close">Close report</button></div>
    </div>
    <div class="report-card">
      <div>
        <h3 class="report-title"><a href="#">Extending a student visa</a></h3>
        <div class="report-meta">Reported 5 days ago</div>
      </div>
      <div class="btn-row"><button class="btn btn-edit">Edit article</button><button class="btn btn-close">Close report</button></div>
    </div>
  </div>
</div>
</body>
</html>
