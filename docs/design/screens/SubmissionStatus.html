<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Submission status — Exchange Student Guide (draft screen)</title>
<!-- Rough Stage-3 sketch, generated from canvas-src/flow/SubmissionStatus.dc.html — not the deliverable,
     a thinking tool. See docs/design/README.md for how this fits the design process. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root { --maroon:#781F19; --ink:#1F1917; --ink-soft:#5B534C; --paper:#FFFFFF; --sand:#F7F4EF; --line:#E6DFD3; --olive:#4B7043; --olive-soft:#EDF2EA; --red:#D9261C; --red-soft:#FBEAE8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .page { font-family: 'Public Sans', system-ui, sans-serif; color: var(--ink); background: var(--sand); min-height: 100%; display: flex; flex-direction: column; }
    .header-bar { display: flex; align-items: center; gap: 14px; padding: 14px 40px; background: var(--paper); border-bottom: 1px solid var(--line); }
    .header-logo { height: 30px; width: auto; }
    .body { padding: 40px; max-width: 520px; }
    .title { font-size: 24px; font-weight: 700; margin: 0 0 20px 0; }
    .field-row { display: flex; gap: 10px; margin-bottom: 28px; }
    .field-input { flex: 1; height: 44px; border: 1.5px solid var(--line); border-radius: 4px; padding: 0 14px; font-size: 15px; font-family: inherit; }
    .btn { height: 44px; padding: 0 20px; border-radius: 4px; font-size: 15px; font-weight: 600; border: none; background: var(--maroon); color: #fff; cursor: pointer; }
    .result-card { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
    .result-number { font-size: 13px; color: var(--ink-soft); font-family: ui-monospace, monospace; }
    .pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; width: fit-content; }
    .pill-rejected { background: var(--red-soft); color: var(--red); }
    .pill-dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
    .reason-label { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin: 4px 0 0 0; }
    .reason-text { font-size: 14px; margin: 4px 0 0 0; }
  </style>
</head>
<body>
<div class="page">
  <div class="header-bar"><img src="../assets/oge-logo.svg" alt="OGE logo" class="header-logo"></div>
  <div class="body">
    <h1 class="title">Track a submission</h1>
    <div class="field-row">
      <input class="field-input" value="SUB-B2WH-4RSD-7NKF">
      <button class="btn">Check status</button>
    </div>
    <div class="result-card">
      <div class="result-number">Submission SUB-B2WH-4RSD-7NKF</div>
      <span class="pill pill-rejected"><span class="pill-dot"></span>Rejected</span>
      <div>
        <p class="reason-label">Reason given by the moderator</p>
        <p class="reason-text">This overlaps heavily with the existing "Opening a bank account" article — please propose it as an edit there instead.</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
