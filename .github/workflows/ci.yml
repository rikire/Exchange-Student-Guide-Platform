name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Invoked through `sh` on purpose: if the executable bit were missing this would still
      # run, and the script's first check reports exactly which file lost it. Calling ./mvnw
      # directly fails with "Permission denied", which says nothing about the cause.
      #
      # CI runs the same script we run locally, so "it passed on my machine" means the same
      # thing here. The traceability gate is added inside it in phase 2.
      - name: Build, test and check formatting
        run: sh scripts/check.sh

      - name: Commit messages follow the convention
        if: github.event_name == 'pull_request'
        run: |
          git log --format=%H origin/${{ github.base_ref }}..HEAD | while read -r sha; do
            git log -1 --format=%B "$sha" > /tmp/msg
            java -jar tools/target/ai-tools.jar commit-msg /tmp/msg || exit 1
          done

      - name: Both members are present in the history
        if: github.event_name == 'pull_request'
        run: |
          echo "Authors in this branch:"
          git log --format='%an <%ae>' origin/${{ github.base_ref }}..HEAD | sort -u
