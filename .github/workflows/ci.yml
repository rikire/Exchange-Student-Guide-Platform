name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Majors verified against the release feeds on 3 Sep 2026, not recalled.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Invoked through `sh` on purpose: if the executable bit were missing this would still
      # run, and the script's first check reports exactly which file lost it. Calling ./mvnw
      # directly fails with "Permission denied", which says nothing about the cause.
      #
      # CI runs the same script we run locally, so "it passed on my machine" means the same
      # thing here. The traceability gate is added inside it in phase 2.
      - name: Build, test and check formatting
        run: sh scripts/check.sh

      # Also on push, not only on pull requests. The local `commit-msg` hook only exists once
      # someone has run scripts/hooks.sh, and that step is easy to forget -- it was forgotten, and a
      # commit reached main with a message the convention rejects, seen by nobody. CI is the one
      # path every commit takes regardless of what is installed on whose laptop.
      #
      # Every message in the range is checked before failing, so a bad push reports all of its
      # problems at once rather than one per re-run.
      - name: Commit messages follow the convention
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            revisions=$(git log --format=%H "origin/${{ github.base_ref }}..HEAD")
          else
            before="${{ github.event.before }}"
            case "$before" in
              ""|0000000000000000000000000000000000000000)
                # A new branch, or history the runner cannot see: check the tip only.
                revisions=$(git log -1 --format=%H) ;;
              *) revisions=$(git log --format=%H "$before..${{ github.sha }}") ;;
            esac
          fi

          failed=0
          for sha in $revisions; do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            if ! java -jar tools/target/ai-tools.jar commit-msg "$RUNNER_TEMP/message"; then
              echo "  ^ in commit $sha by $(git log -1 --format='%an' "$sha")" >&2
              failed=1
            fi
          done
          exit $failed

      - name: Both members are present in the history
        if: github.event_name == 'pull_request'
        run: |
          echo "Authors in this branch:"
          git log --format='%an <%ae>' origin/${{ github.base_ref }}..HEAD | sort -u
