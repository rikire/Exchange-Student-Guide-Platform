    <path d="M7 5h6a3.5 3.5 0 0 1 0 7H7z"/>
    <path d="M7 12h7a3.5 3.5 0 0 1 0 7H7z"/>
  </symbol>
  <symbol id="italic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M10 5h8M6 19h8M15 5 9 19"/>
  </symbol>
  <symbol id="heading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
