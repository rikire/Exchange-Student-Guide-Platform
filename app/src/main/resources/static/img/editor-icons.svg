    <circle cx="4.5" cy="12" r="1" fill="currentColor"/>
    <circle cx="4.5" cy="18" r="1" fill="currentColor"/>
  </symbol>
  <symbol id="ordered-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
