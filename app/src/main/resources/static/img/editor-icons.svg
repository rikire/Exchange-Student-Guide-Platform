  </symbol>
  <symbol id="quote" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M5 5v14M9 8h10M9 12h10M9 16h6"/>
  </symbol>
  <symbol id="unordered-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
