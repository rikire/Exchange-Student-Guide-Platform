<!DOCTYPE html>
<!--
  The frame every page sits in. A page passes its <title> and its <main>:
  th:replace="~{shared/web/Layout :: page(~{::title}, ~{::main})}"
  The viewport, the language and the stylesheets every page shares are what NFR-007 and NFR-008
  rest on (FEAT-011).
-->
<!-- trace: NFR-007, NFR-008 -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${title}">Exchange Student Guide</title>
  <!-- Noto Sans from its WebJar (ADR-0013: assets only as WebJars); the version is the one in the
       root pom's noto-sans.version and has to change with it. -->
  <link rel="stylesheet" th:href="@{/webjars/fontsource__noto-sans/5.2.6/400.css}">
  <link rel="stylesheet" th:href="@{/webjars/fontsource__noto-sans/5.2.6/600.css}">
  <link rel="stylesheet" th:href="@{/webjars/fontsource__noto-sans/5.2.6/700.css}">
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
  <header class="site-header">
    <a class="site-brand" th:href="@{/}">
      <img class="site-logo" th:src="@{/img/oge-logo.svg}" alt="OGE logo">
      <span class="site-name">Exchange Student Guide</span>
      <span class="role-label" th:if="${moderatorArea}">Moderator</span>
    </a>
    <!-- Fix 2.1 (F-6): the four ways on from any page. A wide screen shows the list; a phone or a
         tablet folds it into a native <details> menu, which needs no script under the CSP. -->
    <nav class="site-nav" aria-label="Site">
      <ul class="site-links" th:fragment="links">
        <!-- Fix 2.3 (F-24): a signed-in moderator gets their own links, Log out among them. -->
        <th:block th:if="${moderator}">
          <li><a th:href="@{/moderate/queue}">Queue</a></li>
          <li><a th:href="@{/moderate/reports}">Reports</a></li>
          <li><a th:href="@{/moderate/write}">Write an article</a></li>
          <li><a th:href="@{/moderate/articles}">Homepage &amp; articles</a></li>
          <li><a th:href="@{/}">The guide</a></li>
          <li><form th:replace="~{shared/security/LogOut :: form}"></form></li>
        </th:block>
        <th:block th:unless="${moderator}">
          <li><a th:href="@{/articles}">All articles</a></li>
          <li><a th:href="@{/tags}">Browse tags</a></li>
          <li><a th:href="@{/submissions/status}">Track a submission</a></li>
          <li><a th:href="@{/submit}">Submit an article</a></li>
          <!-- FR-035: who to contact at OGE, and who built the guide. -->
          <li><a th:href="@{/oge-team}">OGE team</a></li>
          <li><a th:href="@{/developers}">Developers</a></li>
        </th:block>
      </ul>
      <details class="site-menu">
        <summary>Menu</summary>
        <ul th:replace="~{shared/web/Layout :: links}"></ul>
      </details>
    </nav>
  </header>
  <main class="site-main" th:replace="${content}">page content</main>
  <footer class="site-footer">Office of Global Engagement, IIT Madras</footer>
</body>
</html>
