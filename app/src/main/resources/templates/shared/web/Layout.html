<!DOCTYPE html>
<!--
  The frame every page sits in. A page passes its <title> and its <main>:
  th:replace="~{shared/web/Layout :: page(~{::title}, ~{::main})}"
  The viewport, the language and the stylesheets every page shares are what NFR-007 and NFR-008
  rest on (FEAT-011).
-->
<!-- trace: NFR-007, NFR-008 -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${title}">Exchange Student Guide</title>
  <!-- Noto Sans from its WebJar (ADR-0013: assets only as WebJars); the version is the one in the
       root pom's noto-sans.version and has to change with it. -->
  <link rel="stylesheet" th:href="@{/webjars/fontsource__noto-sans/5.2.6/400.css}">
  <link rel="stylesheet" th:href="@{/webjars/fontsource__noto-sans/5.2.6/600.css}">
  <link rel="stylesheet" th:href="@{/webjars/fontsource__noto-sans/5.2.6/700.css}">
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
  <header class="site-header">
    <a class="site-brand" th:href="@{/}">
      <img class="site-logo" th:src="@{/img/oge-logo.svg}" alt="OGE logo">
      <span class="site-name">Exchange Student Guide</span>
    </a>
    <nav class="site-nav">
      <a th:href="@{/submit}">Submit an article</a>
    </nav>
  </header>
  <main class="site-main" th:replace="${content}">page content</main>
  <footer class="site-footer">Office of Global Engagement, IIT Madras</footer>
</body>
</html>
