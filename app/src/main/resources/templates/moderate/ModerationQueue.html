<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shared/web/Layout :: page(~{::title}, ~{::main})}">
<head>
  <title>Moderation queue — Exchange Student Guide</title>
</head>
<body>
  <main class="site-main">
    <form th:replace="~{shared/security/LogOut :: form}"></form>
    <h1 class="article-title">Moderation queue</h1>

    <p class="empty-note" th:if="${#lists.isEmpty(entries)}">The queue is empty. Nothing is waiting for a decision.</p>

    <table class="queue-table" tabindex="0" aria-label="Submissions waiting for a decision" th:unless="${#lists.isEmpty(entries)}">
      <thead>
        <tr><th scope="col">Submission</th><th scope="col">Type</th><th scope="col">Title</th><th scope="col">Submitted</th><th scope="col"><span class="visually-hidden">Review</span></th></tr>
      </thead>
      <tbody>
        <tr th:each="entry : ${entries}">
          <td><span th:replace="~{shared/web/SubmissionNumber :: number(${entry.number}, 'queue-number')}">SUB-7QM2-K9XP-4TVB</span></td>
          <td><span class="chip" th:text="${entry.type.name() == 'EDIT'} ? 'Edit' : 'New article'">New article</span></td>
          <td class="queue-title" th:text="${entry.title}" th:title="${entry.title}">Getting a local SIM card</td>
          <td><relative-time lang="en-GB" hour-cycle="h23" th:datetime="${entry.submittedAt}" th:text="${entry.submitted}">28 Sep 2026, 10:00 IST</relative-time></td>
          <td><a th:href="@{/moderate/submissions/{number}(number=${entry.number})}">Review →</a></td>
        </tr>
      </tbody>
    </table>
    <th:block th:replace="~{shared/web/LocalTime :: assets}"></th:block>
  </main>
</body>
</html>
