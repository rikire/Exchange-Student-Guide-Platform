<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- FR-029 (ADR-0015): a body's comparison, paragraph by paragraph. The review page draws it twice,
       as the text reads and as its Markdown (fix 3.7). Every segment is escaped by th:text. -->
  <div class="diff-table" th:fragment="table(diff)">
    <div class="diff-head" aria-hidden="true"><span>Published</span><span>Proposed</span></div>
    <th:block th:each="row : ${diff.rows}">
      <p class="diff-skipped" th:if="${row.kind.name() == 'SKIPPED'}"
         th:text="${row.skipped == 1} ? '1 unchanged paragraph' : ${row.skipped} + ' unchanged paragraphs'">3 unchanged paragraphs</p>
      <div class="diff-row" th:unless="${row.kind.name() == 'SKIPPED'}"
           th:classappend="${'diff-row-' + #strings.toLowerCase(row.kind.name())}">
        <div class="diff-before"><span class="diff-side">Published</span><th:block th:each="part : ${row.before}"><del class="diff-removed" th:if="${part.marked}" th:text="${part.text}">old</del><span th:unless="${part.marked}" th:text="${part.text}">same</span></th:block></div>
        <div class="diff-after"><span class="diff-side">Proposed</span><th:block th:each="part : ${row.after}"><ins class="diff-added" th:if="${part.marked}" th:text="${part.text}">new</ins><span th:unless="${part.marked}" th:text="${part.text}">same</span></th:block></div>
      </div>
    </th:block>
  </div>
</body>
</html>
