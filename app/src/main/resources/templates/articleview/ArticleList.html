<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shared/web/Layout :: page(~{::title}, ~{::main})}">
<head>
  <title>All articles — Exchange Student Guide</title>
</head>
<body>
  <!-- FR-033: every published article, 50 to a page, in the order and with the tag the address names. -->
  <!-- trace:FR-033 -->
  <main class="site-main">
    <h1 class="article-title">All articles</h1>

    <nav aria-label="Order">
      <span class="field-label">Order</span>
      <ul class="chip-row">
        <li class="chip" th:each="order : ${orders}" th:classappend="${!order.current} ? 'chip-link'">
          <a th:if="${!order.current}" th:href="@{${order.href}}" th:text="${order.label}">Most viewed</a>
          <span th:if="${order.current}" aria-current="true" th:text="${order.label}">A–Z</span>
        </li>
      </ul>
    </nav>

    <nav aria-label="Tag" th:if="${!tags.isEmpty()}">
      <span class="field-label">Tag</span>
      <ul class="chip-row">
        <li class="chip" th:classappend="${tag != null} ? 'chip-link'">
          <a th:if="${tag != null}" th:href="@{${allTags}}">All</a>
          <span th:if="${tag == null}" aria-current="true">All</span>
        </li>
        <li class="chip" th:each="choice : ${tags}" th:classappend="${!choice.current} ? 'chip-link'">
          <a th:if="${!choice.current}" th:href="@{${choice.href}}" th:text="${choice.label}">visa</a>
          <span th:if="${choice.current}" aria-current="true" th:text="${choice.label}">visa</span>
        </li>
      </ul>
    </nav>

    <p class="empty-note" th:if="${tagUnknown}">No published article carries this tag. <a th:href="@{/articles}">See all articles</a></p>
    <p class="empty-note" th:if="${!tagUnknown && total == 0}">No articles yet.</p>
    <p class="results-meta" th:if="${total > 0}" th:text="${total} + (${total} == 1 ? ' article' : ' articles')">36 articles</p>

    <div class="card-grid" th:if="${!cards.isEmpty()}">
      <th:block th:each="card : ${cards}"><article th:replace="~{shared/web/ArticleCard :: card(${card}, 2, false)}"></article></th:block>
    </div>

    <nav class="button-row" aria-label="Pages" th:if="${pages > 1}">
      <a th:if="${previous}" th:href="@{${previous}}" rel="prev">← Previous</a>
      <span th:text="'Page ' + ${page} + ' of ' + ${pages}">Page 1 of 2</span>
      <a th:if="${next}" th:href="@{${next}}" rel="next">Next →</a>
    </nav>
    <th:block th:replace="~{shared/web/LocalTime :: assets}"></th:block>
  </main>
</body>
</html>
