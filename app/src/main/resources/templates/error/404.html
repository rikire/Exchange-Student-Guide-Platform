<!DOCTYPE html>
<!--
  Spring Boot's 404 page for every route. Its text names what was asked for, from the path the error
  model carries (walkthrough fix 1.7, F-26): an article, a tag, or any other page. It never says why
  an address is empty: removed, pending and never written look the same from outside (FEAT-008).
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shared/web/Layout :: page(~{::title}, ~{::main})}">
<head>
  <title>Not found — Exchange Student Guide</title>
</head>
<body>
  <main class="site-main" th:with="article=${path != null && #strings.startsWith(path, '/articles/')},
                                   tag=${path != null && #strings.startsWith(path, '/tags/')}">
    <h1 class="article-title" th:text="${tag} ? 'We could not find that tag' : 'We could not find that page'">We could not find that page</h1>
    <p th:if="${article}">There is no published article at this address. <a th:href="@{/}">Back to the guide</a></p>
    <p th:if="${tag}">No published article carries this tag. <a th:href="@{/tags}">Browse the tags</a> or <a th:href="@{/}">go back to the guide</a>.</p>
    <p th:unless="${article || tag}">There is no page at this address. <a th:href="@{/}">Back to the guide</a></p>
  </main>
</body>
</html>
