<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shared/web/Layout :: page(~{::title}, ~{::main})}">
<head>
  <title th:text="${#strings.listJoin(tagPage.names, ', ')} + ' — Exchange Student Guide'">visa — Exchange Student Guide</title>
</head>
<body>
  <main class="site-main">
    <p class="eyebrow">Browsing by tag</p>
    <h1 class="tag-title">
      <span class="chip" th:each="name : ${tagPage.names}" th:text="${name}">visa</span>
    </h1>
    <p class="results-meta" th:text="${tagPage.total} + (${tagPage.total} == 1 ? ' article' : ' articles')">3 articles</p>

    <div class="card-grid">
      <th:block th:each="entry : ${tagPage.entries}"><article th:replace="~{shared/web/ArticleCard :: card(${entry}, 2, false)}"></article></th:block>
    </div>
    <th:block th:replace="~{shared/web/LocalTime :: assets}"></th:block>
  </main>
</body>
</html>
