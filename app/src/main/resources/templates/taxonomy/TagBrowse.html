<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shared/web/Layout :: page(~{::title}, ~{::main})}">
<head>
  <title th:text="${#strings.listJoin(tagPage.names, ', ')} + ' — Exchange Student Guide'">visa — Exchange Student Guide</title>
</head>
<body>
  <main class="site-main">
    <p class="eyebrow">Browsing by tag</p>
    <h1 class="tag-title">
      <span class="chip" th:each="name : ${tagPage.names}" th:text="${name}">visa</span>
    </h1>
    <p class="results-meta" th:text="${tagPage.total} + (${tagPage.total} == 1 ? ' article' : ' articles')">3 articles</p>

    <div class="card-grid">
      <article class="article-card" th:each="entry : ${tagPage.entries}">
        <h2 class="article-card-title"><a th:href="@{${entry.path}}" th:text="${entry.title}">Registering with FRRO</a></h2>
        <p class="article-card-summary" th:text="${entry.summary}">Summary</p>
        <p class="article-card-meta" th:text="'Updated ' + ${entry.updated}">Updated 28 Sep 2026</p>
      </article>
    </div>
  </main>
</body>
</html>
