spring:
  application:
    name: exchange-student-guide
  autoconfigure:
    # Without this, Boot creates a "user" with a random password and logs the password at start-up.
    # The moderator login (ADR-0009) needs no account source: it checks one password against
    # guide.admin.password-hash below.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  thymeleaf:
    # Cached, Spring Boot's default, so the stand parses each template once (DEBT-020, resolved);
    # application-dev.yml turns it off for development.
    cache: true
  jpa:
    # Off so a page cannot lazily load through the view: every association a page shows is fetched
    # by the query that names it (ADR-0010), and a forgotten one fails a test instead of hiding.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Lists that show tags (the landing page) load them for 50 articles per query rather than one
      # query per article — ADR-0010's "batch size", without a collection join fetch, which would
      # make Hibernate apply the page limit in memory.
      hibernate.default_batch_fetch_size: 50
      # FEAT-007 (ADR-0004): Hibernate Search over Lucene. The stand keeps the index on disk in the
      # guide-index volume, beside a database that also survives a restart (docker-compose.yml sets
      # both variables). Unset, the index is in memory, like the H2 database it would otherwise
      # outlive, and like every test context, since Lucene locks a directory to one of them. An empty
      # index is filled from the article table at start-up (search's SearchIndexBuilder). What is
      # indexed and how it is analysed are written in the search slice, not on the shared entities.
      hibernate.search.backend.directory.type: ${GUIDE_INDEX_TYPE:local-heap}
      hibernate.search.backend.directory.root: ${GUIDE_INDEX_DIR:target/search-index}
      hibernate.search.backend.lucene_version: LATEST
      hibernate.search.backend.analysis.configurer: class:in.ac.iitm.guide.search.internal.EnglishAnalysis
      hibernate.search.mapping.configurer: class:in.ac.iitm.guide.search.internal.ArticleSearchMapping

server:
  port: 8080
  servlet:
    session:
      cookie:
        # ADR-0009: the moderator's session cookie. HttpOnly is the container's default; Secure is
        # the deployment's to set once it runs behind TLS (SERVER_SERVLET_SESSION_COOKIE_SECURE).
        same-site: lax
  error:
    whitelabel:
      enabled: false

logging:
  level:
    root: INFO
    in.ac.iitm.guide: DEBUG

guide:
  # F-23: times are stored as they happened and shown in the office's zone, with its label
  # (DisplayTime). On the stand, GUIDE_TIMEZONE in .env.
  time-zone: Asia/Kolkata
  media:
    # ADR-0006: the bytes live here, under names the system generates; the stand mounts a volume
    # (GUIDE_MEDIA_ROOT). NFR-001's limits, which are settings rather than constants; the container's
    # multipart ceiling is derived from them (MediaConfiguration), so it is not set here. On the
    # stand each is GUIDE_MEDIA_PHOTOLIMIT, _DOCUMENTLIMIT, _VIDEOLIMIT or _VOLUMELIMIT in .env.
    root: ${GUIDE_MEDIA_ROOT:target/media}
    photo-limit: 10MB
    document-limit: 20MB
    video-limit: 500MB
    volume-limit: 100GB
    # DEBT-016: a rejected submission's files go this long after the rejection (the human, 1 Oct);
    # GUIDE_MEDIA_REJECTEDKEPTFOR on the stand.
    rejected-kept-for: 7d
  admin:
    # ADR-0009: the BCrypt hash of the office's one shared password, never the password and never in
    # git. Empty means no password logs in (FEAT-006). How to make one: .env.example.
    password-hash: ${GUIDE_ADMIN_PASSWORD_HASH:}
    # ADR-0009 and ADR-0019: failed logins allowed per client address in each window. Only failures
    # count; past the limit even the right password waits.
    failed-login-limit:
      requests: 10
      per: 15m
  report:
    # FR-021: how many reports one client address may send, decided by the human on 2 Oct, so a
    # flood cannot bury the moderator's inbox. Every report counts.
    limit:
      requests: 10
      per: 1h
  contribute:
    # NFR-005 (ADR-0019): what one client address may send. Submissions count a new article and an
    # edit together, and only the ones accepted; the preview counts every request. The address is the
    # connection's own: X-Forwarded-For is not read, so behind a proxy every client shares its address
    # until the deployment sets server.forward-headers-strategy.
    submission-limit:
      requests: 5
      per: 1h
    preview-limit:
      requests: 120
      per: 1m
