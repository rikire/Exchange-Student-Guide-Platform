spring:
  application:
    name: exchange-student-guide
  autoconfigure:
    # Spring Security is here for CSRF only. Without this, Boot creates a "user" with a random
    # password and logs the password at start-up; nothing logs in until the moderator login
    # (ADR-0009), which declares its own account source.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  thymeleaf:
    cache: false
  jpa:
    # Off so a page cannot lazily load through the view: every association a page shows is fetched
    # by the query that names it (ADR-0010), and a forgotten one fails a test instead of hiding.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Lists that show tags (the landing page) load them for 50 articles per query rather than one
      # query per article — ADR-0010's "batch size", without a collection join fetch, which would
      # make Hibernate apply the page limit in memory.
      hibernate.default_batch_fetch_size: 50

server:
  port: 8080
  servlet:
    session:
      cookie:
        # ADR-0009: the moderator's session cookie. HttpOnly is the container's default; Secure is
        # the deployment's to set once it runs behind TLS (SERVER_SERVLET_SESSION_COOKIE_SECURE).
        same-site: lax
  error:
    whitelabel:
      enabled: false

logging:
  level:
    root: INFO
    in.ac.iitm.guide: DEBUG

guide:
  admin:
    # ADR-0009: the BCrypt hash of the office's one shared password, never the password and never in
    # git. Empty means no password logs in (FEAT-006). How to make one: .env.example.
    password-hash: ${GUIDE_ADMIN_PASSWORD_HASH:}
